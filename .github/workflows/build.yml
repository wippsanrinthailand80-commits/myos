name: Build MyOS (Linux From Scratch)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo gawk m4 \
            libmpfr-dev libmpc-dev libgmp-dev wget curl git rsync file \
            python3 perl sed grep findutils diffutils xz-utils bzip2 gzip tar \
            cpio qemu-system-x86

      - name: Set up build dirs
        run: |
          sudo mkdir -p /mnt/lfs
          sudo chown -R $USER:$USER /mnt/lfs
          echo "LFS=/mnt/lfs" >> $GITHUB_ENV
          echo "MYOS_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "MAKEFLAGS=-j$(nproc)" >> $GITHUB_ENV

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: sources
          key: lfs-sources-12.4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: /mnt/lfs/tools
          key: lfs-tools-${{ runner.os }}-${{ hashFiles('scripts/chapter5.sh') }}

      - name: Build cross toolchain (Chapter 5)
        run: bash scripts/chapter5.sh

      - name: Assemble system + kernel
        run: bash scripts/assemble.sh

      - name: Boot test in QEMU
        timeout-minutes: 5
        run: |
          set +e
          timeout 120 qemu-system-x86_64 -kernel rootfs/vmlinuz -initrd rootfs/initramfs.cpio.gz \
            -append "console=ttyS0" -nographic -m 512 > /tmp/qemu.log 2>&1
          echo "=== QEMU log tail ==="
          tail -40 /tmp/qemu.log
          grep -q "MyOS init starting" /tmp/qemu.log && echo "BOOT OK" || echo "BOOT FAIL"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myos-image
          path: |
            rootfs/vmlinuz
            rootfs/initramfs.cpio.gz
          retention-days: 7
